<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>

  <body style="display: none">
    <noscript>Allow JavaScript to unlock the full potential of the application.</noscript>
    <div id="modal">
      <div id="external-container">
        <div id="middle-container">
          <div id="container">
            <h1 id="level-title">Press Any Key to Start</h1>
            <div class="buttons">
              <div class="row">
                <div type="button" id="green" class="btn green"></div>
                <div type="button" id="red" class="btn red"></div>
              </div>
              <div class="row">
                <div type="button" id="yellow" class="btn yellow"></div>
                <div type="button" id="blue" class="btn blue"></div>
              </div>
            </div>
            <button id="backgroundMusicButton">Play Music</button>
          </div>
        </div>
      </div>
    </div>

    <div id="profile-block">
      <img
        id="profile-picture"
        src="assets/images/profile.jpg"
        alt="Profile Picture"
      />
      <div id="profile-name">Player</div>
      <button id="edit-button" type="button">Edit</button>
    </div>

    <div id="print"></div>

    <script src="scripts/meta-tags-min.js"></script>
  </body>
</html>
